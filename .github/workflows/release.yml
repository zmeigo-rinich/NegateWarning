name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: |
          version=$(sed -n 's/^##[[:space:]]*Version:[[:space:]]*\([^[:space:]]*\).*$/\1/p' NegateWarning.txt | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::No '## Version:' line found in NegateWarning.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version v${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Check whether the release already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} already exists - nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release zip
        if: steps.exists.outputs.exists == 'false'
        run: |
          set -e
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist/NegateWarning
          cp NegateWarning.lua NegateWarning.txt readme.txt negatecat.dds dist/NegateWarning/
          (cd dist && zip -r "../NegateWarning_v${version}.zip" NegateWarning)
          unzip -l "NegateWarning_v${version}.zip"

      - name: Create release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          cat > notes.md <<EOF
          ## NegateWarning ${version}

          Предупреждение на экране, пока на игроке висит вражеский Negate Magic / Suppression Field / Absorption Field.

          **Установка:** скачать архив \`NegateWarning_v${version}.zip\`, распаковать в папку AddOns, поставить LibAddonMenu-2.0, выполнить \`/reloadui\`.

          **Install:** download \`NegateWarning_v${version}.zip\`, unpack it into the AddOns folder, install LibAddonMenu-2.0, run \`/reloadui\`.

          Полная инструкция / full guide: [readme.txt](https://github.com/${GITHUB_REPOSITORY}/blob/main/readme.txt) · [README.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md)
          EOF
          gh release create "$tag" "NegateWarning_v${version}.zip" \
            --title "NegateWarning ${version}" \
            --notes-file notes.md
